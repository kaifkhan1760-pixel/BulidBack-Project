# Used by tests via @ActiveProfiles("test").
# H2 is an in-memory database that disappears when the tests finish,
# so tests never read or change the real MySQL buildback_db.
spring.datasource.url=jdbc:h2:mem:buildback_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Uploaded test photos go to a temporary folder, never into the real uploads folder
app.uploads.dir=${java.io.tmpdir}/buildback-test-uploads
app.mail.outbox-dir=${java.io.tmpdir}/buildback-test-mail
app.email-verification.auto-verify-domains=
logging.file.name=
