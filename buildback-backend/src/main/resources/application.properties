spring.application.name=buildback-backend
server.port=8081

# ===== MySQL connection (database created in MySQL Workbench) =====
# Username and password come from environment variables set in Eclipse:
# Run Configurations > BuildbackBackendApplication > Environment
spring.datasource.url=jdbc:mysql://localhost:3306/buildback_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Fail fast (5 seconds) instead of waiting 30 seconds when MySQL is unreachable
spring.datasource.hikari.connection-timeout=5000

# ===== JPA / Hibernate (local development only) =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Load lazy relations (e.g. the seller of each listing on a page) in batches of up to 50
# with one "IN (...)" query, instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===== JSON =====
# Reject 2.5 for a whole-number field (like quantity) instead of silently cutting it to 2
spring.jackson.deserialization.accept-float-as-int=false

# ===== Frontend allowed to call this API (used by CorsConfig) =====
app.cors.allowed-origins=http://localhost:5173

# ===== Login session (JSESSIONID cookie) =====
# Logged out automatically after 30 minutes without any request
server.servlet.session.timeout=30m
# JavaScript cannot read the cookie
server.servlet.session.cookie.http-only=true
# Sent on same-site requests only (localhost:5173 -> localhost:8081 is same-site)
server.servlet.session.cookie.same-site=lax
# Must be true when the site is served over HTTPS; false so local http:// works
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Never put the session ID in URLs
server.servlet.session.tracking-modes=cookie

# ===== Orders =====
# An unpaid order keeps its stock reserved for this long, then expires
app.orders.reservation-minutes=15
# How often (ms) the expiry job looks for overdue orders
app.orders.expiry-check-ms=60000

# ===== Payments (TEST MODE ONLY) =====
# simulator = built-in, clearly labelled demo gateway (default)
# razorpay  = Razorpay test mode; also set RAZORPAY_KEY_ID (rzp_test_...) and RAZORPAY_KEY_SECRET
# The secret stays on the server; never put it in the frontend .env
app.payments.provider=${PAYMENT_PROVIDER:simulator}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ===== One-time admin account creation (OFF unless you turn it on) =====
# Set these as Eclipse environment variables, run once, then set ADMIN_BOOTSTRAP_ENABLED=false
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.name=${ADMIN_NAME:BuildBack Admin}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
